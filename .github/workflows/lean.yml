name: Lean
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Se o repositório do enunciado for privado, o token padrão do Actions não consegue
      # cloná-lo: torne o enunciado público ou configure um token com acesso de leitura.
      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
